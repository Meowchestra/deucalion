name: Auto Update Cargo

on:
  schedule:
    - cron: "0 0 1 */6 *"  # Every 6 months
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Upgrade Dependencies in Cargo.toml
        run: cargo upgrade --verbose

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected, skipping PR."
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Create Pull Request
        if: env.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Cargo dependencies"
          branch: update-cargo
          title: "Update Cargo Dependencies"
          body: "Automated dependency update"
          labels: dependencies
          reviewers: "Meowchestra"
          base: develop